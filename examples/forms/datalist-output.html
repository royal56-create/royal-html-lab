<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Examples of the HTML datalist and output elements.">
<title>Datalist and Output Elements</title>
</head>
<body>
<main>
<h1>Datalist and output</h1>
<section aria-labelledby="suggestions-title">
<h2 id="suggestions-title">Suggested values with datalist</h2>
<label for="browser">Choose or type a browser</label>
<input id="browser" name="browser" list="browser-options">
<datalist id="browser-options">
<option value="Chrome"></option>
<option value="Firefox"></option>
<option value="Safari"></option>
<option value="Edge"></option>
</datalist>
</section>
<section aria-labelledby="calculation-title">
<h2 id="calculation-title">Calculated output</h2>
<form oninput="total.value=(Number(price.value)*Number(quantity.value)).toFixed(2)">
<label for="price">Price per item</label>
<input id="price" name="price" type="number" min="0" step="0.01" value="10">
<label for="quantity">Quantity</label>
<input id="quantity" name="quantity" type="number" min="0" step="1" value="2">
<p>Total: <output name="total" for="price quantity">20.00</output></p>
</form>
</section>
<p>These native elements enhance forms. Validate and calculate important values again on a trusted server in production.</p>
</main>
</body>
</html>
