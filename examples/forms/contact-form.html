<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Accessible HTML Form Example</title><meta name="description" content="Native form controls with labels and validation."></head><body><main><h1>Workshop registration</h1><p>This local example has no server and does not submit registrations.</p><form action="#" method="get"><fieldset><legend>Participant details</legend><p><label for="full-name">Full name</label><br><input id="full-name" name="full-name" autocomplete="name" required minlength="2"></p><p><label for="mail">Email</label><br><input id="mail" name="mail" type="email" autocomplete="email" required></p><p><label for="level">Experience level</label><br><select id="level" name="level" required><option value="">Select one</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></p><p><label for="session-date">Preferred date</label><br><input id="session-date" name="session-date" type="date"></p><p><label for="notes">What would you like to learn?</label><br><textarea id="notes" name="notes" rows="4"></textarea></p><button type="button">Check required fields</button></fieldset></form><p id="form-status" role="status" aria-live="polite">Demo only: no information is sent or stored.</p></main><script>"use strict";const form=document.querySelector("form");const button=form.querySelector('button[type="button"]');button.addEventListener("click",()=>{if(form.reportValidity()){document.querySelector("#form-status").textContent="Validation passed. Demo only: no information was sent or stored.";}});</script>
</body></html>
