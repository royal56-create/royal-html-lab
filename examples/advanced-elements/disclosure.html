<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HTML Disclosure and Progress Elements</title></head><body><main><h1>Useful native HTML elements</h1><section><h2>Disclosure</h2><details><summary>What is semantic HTML?</summary><p>Semantic HTML uses elements that communicate the meaning and role of content.</p></details></section><section><h2>Progress</h2><label for="course-progress">Course progress</label> <progress id="course-progress" value="3" max="5">60%</progress></section><section><h2>Meter</h2><label for="storage">Example storage usage</label> <meter id="storage" min="0" max="100" low="30" high="80" optimum="20" value="65">65%</meter></section></main></body></html>
