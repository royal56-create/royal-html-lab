<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HTML Media Elements</title></head><body><main><h1>Media element examples</h1><section><h2>Image</h2><figure><img src="../../assets/images/placeholder.svg" width="640" height="360" alt="Abstract placeholder landscape with a sun and layered hills"><figcaption>A local SVG image with descriptive alternative text.</figcaption></figure></section><section><h2>Audio</h2><p>Replace the source with audio you own or are licensed to use.</p><audio controls><source src="sample-audio.ogg" type="audio/ogg"><source src="sample-audio.mp3" type="audio/mpeg">Your browser does not support audio.</audio></section><section><h2>Video</h2><video controls width="640" poster="../../assets/images/placeholder.svg"><source src="sample-video.mp4" type="video/mp4">Your browser does not support video.</video><p>Media files are not bundled; add licensed local files to test playback.</p></section></main></body></html>
