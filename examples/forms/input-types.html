<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HTML Input Types Reference</title></head><body><main><h1>Common HTML input types</h1><form action="#" method="get"><p><label for="text">Text</label> <input id="text" name="text" type="text"></p><p><label for="email">Email</label> <input id="email" name="email" type="email"></p><p><label for="password">Password</label> <input id="password" name="password" type="password" autocomplete="new-password"></p><p><label for="number">Number</label> <input id="number" name="number" type="number" min="0" max="100"></p><p><label for="date">Date</label> <input id="date" name="date" type="date"></p><p><label for="color">Color</label> <input id="color" name="color" type="color" value="#ff8833"></p><p><label for="range">Range</label> <input id="range" name="range" type="range" min="0" max="10"></p><p><label for="file">File</label> <input id="file" name="file" type="file"></p><button type="submit">Submit demo form</button></form><p>No file is uploaded to a server.</p></main></body></html>
